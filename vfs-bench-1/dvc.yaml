    do:
      cmd: uv run python task/toolathlon/script/derive_task_md.py ${item}
      deps:
        - submodule/Toolathlon/tasks/finalpool/${item}/docs/task.md
        - task/toolathlon/script/derive_task_md.py
      outs:
        - task/toolathlon/${item}/shared/task.md:
            cache: false

  # The four notion fixtures rendered from the shared template. Each reads
  # `shared/notion_template.py`, so a change there moves all four and
  # `dvc status` is what says so.
  notion:
    foreach:
      - notion-hr
      - notion-personal-website
      - oil-price
      - quantitative-financial-analysis
    do:
      cmd: uv run python task/toolathlon/${item}/shared/author_fixture.py
      deps:
        - task/toolathlon/${item}/shared/author_fixture.py
        - task/toolathlon/shared/notion_template.py
      outs:
        - task/toolathlon/${item}/shared/notion_fixture.json:
            cache: false

  # The rows mirage's kit actually seeds, converted from the authored
  # fixture above. Two files rather than one because they answer to two
  # different readers: `notion_fixture.json` is the vendor's own REST shape
  # and is what a person reviews, `notion_rows.json` is one flat record per
  # Prisma table and is what `POST /reset` loads. Convert rather than
  # re-author, so the reviewable file stays the source and `dvc status` is
  # what says the derived one has drifted.
  notion-rows:
    foreach:
      - notion-hr
      - notion-personal-website
      - oil-price
      - quantitative-financial-analysis
    do:
      cmd: uv run python task/toolathlon/shared/notion_rows.py ${item}
      deps:
        - task/toolathlon/shared/notion_rows.py
        - task/toolathlon/${item}/shared/notion_fixture.json
        - task/toolathlon/${item}/shared/notion.json
      outs:
        - task/toolathlon/${item}/shared/notion_rows.json:
            cache: false

  # Upstream's answer sheet, minus the UTF-8 BOM that makes csv.DictReader
  # read the first column as `﻿Team`.
  nhl-gt:
    cmd: uv run python task/toolathlon/nhl-b2b-analysis/shared/derive_gt.py
    deps:
      - task/toolathlon/nhl-b2b-analysis/shared/derive_gt.py
      - submodule/Toolathlon/tasks/finalpool/nhl-b2b-analysis/groundtruth_workspace/standard_answer.csv
    outs:
      - task/toolathlon/nhl-b2b-analysis/shared/gt.csv:
          cache: false

  # Frozen: the live Hub MCP server's own answers to the Dataset Viewer
  # operations mirage's fake refuses, for each dataset a task's file
  # fixture pins. `dvc repro` must never refetch them; to recapture
  # deliberately, run the stage's command, review, then
  # `dvc commit capture-hub-viewer@<task> -f`.
  capture-hub-viewer:
    foreach:
      - dataset-license-issue
      - verl-dataset
    do:
      frozen: true
      cmd: uv run python task/toolathlon/script/capture_hub_viewer.py capture ${item}
      deps:
        - task/toolathlon/script/capture_hub_viewer.py
        - server/fakes/hub_viewer.py
      outs:
        - task/toolathlon/${item}/shared/hub-viewer:
            cache: false

  # The receipt's hash and pins, and the proxy that replays the capture in
  # front of the fake for both arms.
  hub-viewer-lineage:
    cmd: uv run python task/toolathlon/script/capture_hub_viewer.py verify && uv run python -m unittest tests.hub_viewer
    deps:
      - task/toolathlon/script/capture_hub_viewer.py
      - server/fakes/hub_viewer.py
      - tests/hub_viewer.py
      - task/toolathlon/__init__.py
      - task/toolathlon/dataset-license-issue/shared/hub-viewer
      - task/toolathlon/dataset-license-issue/shared/build_fixture.py
      - task/toolathlon/verl-dataset/shared/hub-viewer
      - task/toolathlon/verl-dataset/shared/seed_hf.py
      - submodule/mirage/integ/fixtures/hf-mcp/tools.json

  # The project the issue was filed against, at the commit it was read at,
  # and the two cards the answer is in, each at its own commit. Pinned all
  # three ways round: the evaluator fails a run whose GitHub HEAD moved, and
  # the whole question is which licence two real repositories declare, so a
  # fixture tracking a branch would be a fixture that could change the
  # answer. Two screenshots are stubbed, the way email-paper-homepage stubs
  # binaries; everything else is verbatim.
  dataset-license-issue-fixture:
    cmd: uv run python task/toolathlon/dataset-license-issue/shared/build_fixture.py
    deps:
      - task/toolathlon/dataset-license-issue/shared/build_fixture.py
      - task/toolathlon/dataset-license-issue/shared/seed_github.py
      - task/toolathlon/dataset-license-issue/shared/seed_hf.py
      - submodule/Toolathlon/tasks/finalpool/dataset-license-issue/files/hf-reasoning/README.md
      - submodule/Toolathlon/tasks/finalpool/dataset-license-issue/files/hf-raw/README.md
    outs:
      - task/toolathlon/dataset-license-issue/shared/fixtures:
          cache: false
      - task/toolathlon/dataset-license-issue/shared/hub:
          cache: false

  nhl-input:
    frozen: true
    cmd: uv run python task/toolathlon/nhl-b2b-analysis/shared/capture_schedule.py
    deps:
      - task/toolathlon/nhl-b2b-analysis/shared/capture_schedule.py
      - task/toolathlon/nhl-b2b-analysis/shared/nhl.source.json
      - submodule/Toolathlon/tasks/finalpool/nhl-b2b-analysis/docs/task.md
    outs:
      - task/toolathlon/nhl-b2b-analysis/shared/nhl.csv:
          cache: false

  # Frozen for the same reason: `script/capture_web.py` fetches the live
  # URLs a task's agent is expected to look at. `--check` re-fetches and reports
  # drift deliberately; `dvc repro` must not do it as a side effect.
  capture-web:
    foreach:
      - course-schedule
      - verl-dataset
    do:
      frozen: true
      cmd: uv run python task/toolathlon/script/capture_web.py --task ${item}
      deps:
        - task/toolathlon/script/capture_web.py
      outs:
        - task/toolathlon/${item}/shared/web_fixture.json:
            cache: false

  # The model card links a mutable branch URL, so this capture also records
  # the immutable commit and body checksum that make its licence reproducible.
  capture-dataset-license-web:
    frozen: true
    cmd: uv run python task/toolathlon/script/capture_web.py --task dataset-license-issue
    deps:
      - task/toolathlon/script/capture_web.py
      - task/toolathlon/dataset-license-issue/shared/web_source.json
      - task/toolathlon/dataset-license-issue/shared/hub/models/deepseek-ai__DeepSeek-V2.5/README.md
    outs:
      - task/toolathlon/dataset-license-issue/shared/web_fixture.json:
          cache: false

  # Four recovered Git fixture trees have byte-verified source revisions.
  # GitHub search results remain a frozen API capture.
  fixture-tree:
    foreach:
      email-paper-homepage:
        script: task/toolathlon/email-paper-homepage/shared/build_fixture.py
        source: task/toolathlon/email-paper-homepage/shared/sources.json
      personal-website-construct:
        script: task/toolathlon/personal-website-construct/shared/build_fixture.py
        source: task/toolathlon/personal-website-construct/shared/sources.json
      sync-todo-to-readme:
        script: task/toolathlon/sync-todo-to-readme/shared/build_fixture.py
        source: task/toolathlon/sync-todo-to-readme/shared/sources.json
    do:
      cmd: uv run python ${item.script}
      deps:
        - ${item.script}
        - ${item.source}
        - task/toolathlon/script/git_fixture.py
      outs:
        - task/toolathlon/${key}/shared/fixtures:
            cache: false

  # Run the original mail loader and formatter against the pinned date and
  # placeholders. The stale committed export differs from what upstream
  # actually imports after preprocessing.
  email-paper-homepage-mail:
    cmd: uv run python task/toolathlon/email-paper-homepage/shared/derive_mail.py
    deps:
      - task/toolathlon/email-paper-homepage/shared/derive_mail.py
      - submodule/Toolathlon/tasks/finalpool/email-paper-homepage/preprocess/main.py
      - submodule/Toolathlon/utils/app_specific/poste/local_email_manager.py
      - submodule/Toolathlon/tasks/finalpool/email-paper-homepage/files/emails.jsonl
      - submodule/Toolathlon/tasks/finalpool/email-paper-homepage/files/placeholder_values.json
      - submodule/Toolathlon/tasks/finalpool/email-paper-homepage/groundtruth_workspace/today.txt
      - submodule/Toolathlon/tasks/finalpool/email-paper-homepage/emails_config.json
    outs:
      - task/toolathlon/email-paper-homepage/shared/importable_emails.json:
          cache: false

  capture-git-repo:
    frozen: true
    cmd: uv run python task/toolathlon/git-repo/shared/capture_repos.py
    deps:
      - task/toolathlon/git-repo/shared/capture_repos.py
      - submodule/Toolathlon/tasks/finalpool/git-repo/docs/task.md
    outs:
      - task/toolathlon/git-repo/shared/fixtures:
          cache: false

  # The last fixture that is a verbatim upstream file. No script: the copy
  # is the whole derivation, and `git show` reads it from the pinned commit
  # rather than off the submodule's working tree, which setup_toolathlon.py
  # edits.
  notion-hr-template:
    cmd: >-
      git -C submodule/Toolathlon show
      HEAD:tasks/finalpool/notion-hr/files/reject_template.txt
      > task/toolathlon/notion-hr/shared/reject_template.txt
    deps:
      - submodule/Toolathlon/tasks/finalpool/notion-hr/files/reject_template.txt
    outs:
      - task/toolathlon/notion-hr/shared/reject_template.txt:
          cache: false

  # Toolathlon-GYM's ask, the same shape as `ask` above because it is the
  # same task format at a different pin: one stage per task, byte-for-byte,
  # depending on upstream's own file so that bumping the gitlink names every
  # ask whose text moved. GYM's fixtures need no stage of their own -- a task
  # states its setup as a `preprocess/main.py` this repo runs rather than as
  # data this repo copies, so the gitlink is the whole of their lineage.
  gym-ask:
    foreach:
      - howtocook-event-menu-ppt
    do:
      cmd: uv run python task/toolathlon-gym/script/derive_task_md.py ${item}
      deps:
        - submodule/toolathlon_gym/tasks/finalpool/${item}/docs/task.md
        - task/toolathlon-gym/script/derive_task_md.py
      outs:
        - task/toolathlon-gym/${item}/shared/task.md:
            cache: false

  # MCP-Atlas has two halves and only one of them is committed. The fixture
  # tree is upstream's sandbox image `/data`, one directory shared by all 500
  # tasks, so it is materialised out of `submodule/mcp-atlas` at seed time and
  # never lands in this repo -- the gitlink is its whole lineage and there is
  # nothing here that could drift from it. The 500 task rows live on the Hub,
  # which is not a checkout, so those *are* committed and this stage is what
  # traces them. dvc cannot depend on a URL, so the revision is a constant in
  # the script and the script is the dependency -- which still means bumping
  # it shows up as drift here.
  atlas-task:
    foreach:
      - age-group-consumption-boss-email
      - amlo-year-new-clients
      - animal-business-sarmiento-week
      - apartment-117-paris-temperature
      - arson-may-service-requests
