# Which committed fixture came from what, in a form that can be checked.
#
# A stage per fixture that has a source it could drift from: derived from
# upstream's own file, or generated by a deterministic script in this repo.
#
# Frozen stages protect snapshots but do not prove reproducible source
# lineage. Four GitHub fixture builders still need original source commit
# pins, and the NHL schedule capture is untraced; a clean `dvc status`
# does not close those gaps.
#
# Every output is `cache: false`: the fixtures are small and committed, so
# git stays the store and dvc only records what produced them. There is no
# dvc remote and there should not be one.
#
#   uv run dvc status     what has drifted from its source
#   uv run dvc repro      rebuild whatever drifted
#
# `dvc status` is the point of the file. Bump submodule/Toolathlon and it
# names every ask whose upstream text moved, which nothing else in the repo
# would notice.

stages:
  verl-hub-search:
    frozen: true
    cmd: uv run python task/toolathlon/verl-dataset/shared/capture_search.py
    deps:
      - task/toolathlon/verl-dataset/shared/capture_search.py
      - submodule/Toolathlon/tasks/finalpool/verl-dataset/docs/task.md
    outs:
      - task/toolathlon/verl-dataset/shared/search.json:
          cache: false

  course-assistant-mail-account:
    cmd: cp submodule/Toolathlon/tasks/finalpool/course-assistant/emails_config.json task/toolathlon/course-assistant/shared/emails_config.json
    deps:
      - submodule/Toolathlon/tasks/finalpool/course-assistant/emails_config.json
    outs:
      - task/toolathlon/course-assistant/shared/emails_config.json:
          cache: false

  upstream-mcp-configs:
    # `setup/toolathlon/setup_toolathlon.py` rewrites these four in the
    # checkout, writing this checkout's own absolute paths into them, so
    # every stage below depends on the pinned copies it takes first rather
    # than on the rewritten files.
    #
    # The source of those copies is `git show HEAD:` inside
    # submodule/Toolathlon -- a commit, and DVC can only hash paths. No path
    # stands in for it. The four files in the checkout are the rewritten
    # ones, which is why `.dvcignore` names them; and the gitlink
    # `submodule/Toolathlon` hashes the whole working tree, which includes
    # `configs/token_key_session.py` and `configs/global_configs.py` --
    # written per checkout by `write_configs`, one of them holding this
    # checkout's absolute path -- so that dep would be the per-checkout hash
    # issue #8 was about, over 2119 files instead of four. Declared always
    # changed instead: re-pinning is four `git show`s, and it is the only
    # way a `submodule/Toolathlon` bump that moved one of these configs
    # reaches `dvc status` at all. `dvc repro` then rewrites the copies and
    # the stages below name themselves.
    always_changed: true
    cmd: uv run python -c "from setup.toolathlon.setup_toolathlon import pin_upstream_configs; pin_upstream_configs()"
    deps:
      - setup/toolathlon/setup_toolathlon.py
    outs:
      - setup/toolathlon/upstream/howtocook.yaml:
          cache: false
      - setup/toolathlon/upstream/google_calendar.yaml:
          cache: false
      - setup/toolathlon/upstream/google_sheet.yaml:
          cache: false
      - setup/toolathlon/upstream/terminal.yaml:
          cache: false
      - setup/toolathlon/upstream/yahoo-finance.yaml:
          cache: false

  toolathlon-python-packages:
    cmd: uv run python task/toolathlon/script/setup_upstream_python.py
    deps:
      - task/toolathlon/script/setup_upstream_python.py
      - submodule/Toolathlon/pyproject.toml
      - submodule/Toolathlon/uv.lock
      - submodule/Toolathlon/utils/aux_tools/python_interpretor.py
      - submodule/Toolathlon/tasks/finalpool/arrange-workspace/task_config.json
      - submodule/mirage/typescript/pnpm-lock.yaml
      - task/toolathlon/arrange-workspace/vfs/workspace.yaml
      - submodule/mirage/typescript/packages/core/src/runtime/python
    outs:
      - vendor/toolathlon-python:
          cache: false

  google-cli-tools:
    cmd: uv run python -c "from server.mcp.setup_calendar import capture_google_tools; capture_google_tools()"
    deps:
      - server/mcp/npm_lock.py
      - server/mcp/setup_calendar.py
      - task/toolathlon/script/setup_pyodide_packages.py
      - submodule/mirage/typescript/pnpm-lock.yaml
      - server/mcp/mcp_servers.py
      - server/seed/travel_video.py
      - server/clients/original_tools.mjs
      - server/clients/original_tools.py
      - cli/toolathlon/google.mjs
      - cli/toolathlon/tool.mjs
      - cli/toolathlon/tool-client.mjs
      - vendor/calendar-mcp/package.json
      - vendor/calendar-mcp/package-lock.json
      - vendor/google-sheets-mcp/pyproject.toml
      - vendor/google-sheets-mcp/uv.lock
      - vendor/google-sheets-mcp/source.json
      - redirect/gws_calendar
      - redirect/gws_sheets
      - setup/toolathlon/upstream/google_calendar.yaml
      - setup/toolathlon/upstream/google_sheet.yaml
      - task/toolathlon/gdp-cr5-analysis/vfs
      - task/toolathlon/inter-final-performance-analysis/vfs
      - task/toolathlon/investment-decision-analysis/vfs
      - task/toolathlon/k8s-safety-audit/vfs
      - task/toolathlon/llm-training-dataset/vfs
      - task/toolathlon/nhl-b2b-analysis/vfs
      - task/toolathlon/quantitative-financial-analysis/vfs
