    outs:
      - vendor/emails-mcp/source.json:
          cache: false
      - vendor/emails-mcp/tools.json:
          cache: false

  # One per task, because each ask has its own upstream file to depend on.
  # The copy is byte-for-byte -- `shared/task.md` is excluded from the
  # whitespace hooks precisely so it stays upstream's bytes.
  ask:
    foreach:
