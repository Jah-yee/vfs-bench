      - arrange-workspace
      - cooking-guidance
      - dataset-license-issue
      - course-assistant
      - course-schedule
      - courses-ta-hws
      - detect-revised-terms
      - dietary-health
      - email-paper-homepage
      - excel-data-transformation
      - excel-market-research
      - flagged-transactions
      - game-statistics
      - git-bug-hunt
      - git-milestone
      - git-repo
      - huggingface-upload
      - imagenet
      - interview-report
      - investment-decision-analysis
      - invoice-org
      - k8s-deployment-cleanup
      - landing-task-reminder
