    deps:
      - server/mcp/setup_email.py
      - server/mcp/mcp_servers.py
      - server/clients/original_tools.py
      - server/seed/travel_video.py
      - task/toolathlon/__init__.py
      - cli/toolathlon/emails.mjs
      - cli/toolathlon/tool.mjs
      - cli/toolathlon/tool-client.mjs
      - vendor/emails-mcp/pyproject.toml
      - vendor/emails-mcp/uv.lock
      - submodule/Toolathlon/configs/mcp_servers/emails.yaml
      - submodule/Toolathlon/tasks/finalpool/apply-phd-email/task_config.json
      - submodule/Toolathlon/tasks/finalpool/canvas-arrange-exam/task_config.json
      - submodule/Toolathlon/tasks/finalpool/canvas-art-manager/task_config.json
      - submodule/Toolathlon/tasks/finalpool/canvas-homework-grader-python/task_config.json
      - submodule/Toolathlon/tasks/finalpool/canvas-submit-late-work/task_config.json
      - submodule/Toolathlon/tasks/finalpool/course-assistant/task_config.json
      - submodule/Toolathlon/tasks/finalpool/email-paper-homepage/task_config.json
      - submodule/Toolathlon/tasks/finalpool/filter-low-selling-products/task_config.json
      - submodule/Toolathlon/tasks/finalpool/git-bug-hunt/task_config.json
      - submodule/Toolathlon/tasks/finalpool/k8s-deployment-cleanup/task_config.json
      - submodule/Toolathlon/tasks/finalpool/landing-task-reminder/task_config.json
      - submodule/Toolathlon/tasks/finalpool/meeting-assign/task_config.json
      - submodule/Toolathlon/tasks/finalpool/notion-find-job/task_config.json
      - submodule/Toolathlon/tasks/finalpool/notion-hr/task_config.json
      - submodule/Toolathlon/tasks/finalpool/payable-invoice-checker/task_config.json
      - submodule/Toolathlon/tasks/finalpool/set-conf-cr-ddl/task_config.json
      - submodule/Toolathlon/tasks/finalpool/sla-timeout-monitor/task_config.json
      - submodule/Toolathlon/tasks/finalpool/student-interview/task_config.json
      - submodule/Toolathlon/tasks/finalpool/travel-expense-reimbursement/task_config.json
      - submodule/Toolathlon/tasks/finalpool/woocommerce-customer-survey/task_config.json
      - submodule/Toolathlon/tasks/finalpool/woocommerce-new-product/task_config.json
      - submodule/Toolathlon/tasks/finalpool/woocommerce-new-welcome/task_config.json
      - submodule/Toolathlon/tasks/finalpool/woocommerce-product-recall/task_config.json
      - submodule/Toolathlon/tasks/finalpool/woocommerce-stock-alert/task_config.json
      - task/toolathlon/apply-phd-email/vfs
      - task/toolathlon/canvas-arrange-exam/vfs
      - task/toolathlon/canvas-art-manager/vfs
      - task/toolathlon/canvas-homework-grader-python/vfs
      - task/toolathlon/canvas-submit-late-work/vfs
      - task/toolathlon/course-assistant/vfs
      - task/toolathlon/email-paper-homepage/vfs
      - task/toolathlon/filter-low-selling-products/vfs
      - task/toolathlon/git-bug-hunt/vfs
      - task/toolathlon/k8s-deployment-cleanup/vfs
      - task/toolathlon/landing-task-reminder/vfs
      - task/toolathlon/meeting-assign/vfs
      - task/toolathlon/notion-find-job/vfs
      - task/toolathlon/notion-hr/vfs
      - task/toolathlon/payable-invoice-checker/vfs
      - task/toolathlon/set-conf-cr-ddl/vfs
      - task/toolathlon/sla-timeout-monitor/vfs
      - task/toolathlon/student-interview/vfs
      - task/toolathlon/travel-expense-reimbursement/vfs
      - task/toolathlon/woocommerce-customer-survey/vfs
      - task/toolathlon/woocommerce-new-product/vfs
      - task/toolathlon/woocommerce-new-welcome/vfs
      - task/toolathlon/woocommerce-product-recall/vfs
