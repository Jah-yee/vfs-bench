mode: EXEC

# The character type upstream's servers run under: started with no locale,
# their Python coerces it to C.UTF-8 (PEP 538) and what they run inherits
# it, so grep, sed and expr match whole characters there as here.
env:
  LC_CTYPE: C.UTF-8

# pyodide, because Atlas enables `mcp-code-executor` here: the MCP arm has an
# interpreter, so this one has one too.
runtimes:
  - pyodide
  - workspace

clis:
  # Calendar as the MCP arm has it: its own server, on the fake this run seeds
  # from Atlas's export, listing only the tools Atlas enables,
  # `google-workspace <tool>` for its `google-workspace_<tool>`. timeoutMs is
  # that arm's per-call bound, upstream's `toolCallTimeoutMs`.
  google-workspace:
    cli: ../../../../cli/mcpatlas/tools.mjs:GOOGLE_WORKSPACE
    config:
      apiBase: ${GOOGLE_WORKSPACE_CLI_URL}
      timeoutMs: 60000

  # GitHub, mirage's fake, on the one token both arms are given: the MCP
  # arm's server is sent there by its hook and reads GITHUB_TOKEN, and `gh`
  # is handed the same fake and token.
  gh:
    cli: gh
    config:
      token: ${GITHUB_TOKEN}
      baseUrl: ${GITHUB_URL}

  # The two servers no mount or native CLI can speak for. Each is the server
  # the MCP arm runs, on the same workspace, listing only the tools Atlas
  # enables. timeoutMs is that arm's per-call bound, which is upstream's: its
  # harness gives each tool call `toolCallTimeoutMs`, 60 seconds by default.
  memory:
    cli: ../../../../cli/mcpatlas/tools.mjs:MEMORY
    config:
      apiBase: ${MEMORY_CLI_URL}
      timeoutMs: 60000

  calculator:
    cli: ../../../../cli/mcpatlas/tools.mjs:CALCULATOR
    config:
      apiBase: ${CALCULATOR_CLI_URL}
      timeoutMs: 60000

mounts:
  # A shell without scratch space is not a shell: agents write a heredoc to
  # /tmp and read it back a line later.
  /tmp:
    vfs: ram

  # The fixture. Named /data because that is where Atlas puts it, so the two
  # arms are told the same path as well as given the same bytes.
  /data:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}

  # The calendar, read-only, as every Calendar tool Atlas enables here reads.
  /calendar:
    vfs: gcal
    mode: READ
    config:
      accessToken: gws-integ-token
      apiBase: ${CALENDAR_URL}

# Every command runs under `whole_mount.py`, which refuses a walk of a
# whole mount and a `cat` of a whole table, asked before the line runs, to
# refuse it whole, and before each command.
profiles:
  default:
    policy:
      pre_execute:
        - {script: ../../whole_mount.py, runtime: monty}
      pre_command:
        - {script: ../../whole_mount.py, runtime: monty}
