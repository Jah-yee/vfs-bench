mode: EXEC

# The character type upstream's servers run under: started with no locale,
# their Python coerces it to C.UTF-8 (PEP 538) and what they run inherits
# it, so grep, sed and expr match whole characters there as here.
env:
  LC_CTYPE: C.UTF-8

# No Python. None of the fifteen tools Atlas enables runs code on this
# machine, so an interpreter here would be a capability the other arm was
# never given.
runtimes:
  - workspace

clis:
  # Notion and Slack as the MCP arm has them: their own servers, on the fakes
  # this run seeds from Atlas's export, listing only the tools Atlas enables,
  # `<server> <tool>` for its `<server>_<tool>`, less Notion's `API-`.
  # timeoutMs is that arm's per-call bound, upstream's `toolCallTimeoutMs`.
  notion:
    cli: ../../../../cli/mcpatlas/tools.mjs:NOTION
    config:
      apiBase: ${NOTION_CLI_URL}
      timeoutMs: 60000

  slack:
    cli: ../../../../cli/mcpatlas/tools.mjs:SLACK
    config:
      apiBase: ${SLACK_CLI_URL}
      timeoutMs: 60000

  # Airtable as the MCP arm has it: its own server, on the fake this run seeds
  # from the base Atlas shares, listing only the tools Atlas enables,
  # `airtable <tool>` for its `airtable_<tool>`. timeoutMs is that arm's
  # per-call bound, upstream's `toolCallTimeoutMs`.
  airtable:
    cli: ../../../../cli/mcpatlas/tools.mjs:AIRTABLE
    config:
      apiBase: ${AIRTABLE_CLI_URL}
      timeoutMs: 60000

  # The three servers no mount or native CLI can speak for. Each is the server
  # the MCP arm runs, on the same workspace, listing only the tools Atlas
  # enables. timeoutMs is that arm's per-call bound, which is upstream's: its
  # harness gives each tool call `toolCallTimeoutMs`, 60 seconds by default.
  calculator:
    cli: ../../../../cli/mcpatlas/tools.mjs:CALCULATOR
    config:
      apiBase: ${CALCULATOR_CLI_URL}
      timeoutMs: 60000

  exa:
    cli: ../../../../cli/mcpatlas/tools.mjs:EXA
    config:
      apiBase: ${EXA_CLI_URL}
      timeoutMs: 60000

  context7:
    cli: ../../../../cli/mcpatlas/tools.mjs:CONTEXT7
    config:
      apiBase: ${CONTEXT7_CLI_URL}
      timeoutMs: 60000

mounts:
  # A shell without scratch space is not a shell: agents write a heredoc to
  # /tmp and read it back a line later.
  /tmp:
    vfs: ram

  # The fixture. Named /data because that is where Atlas puts it, so the two
  # arms are told the same path as well as given the same bytes.
  /data:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}

  # The base, read-only, as every Airtable tool Atlas enables here reads.
  /airtable:
    vfs: airtable
    mode: READ
    config:
      token: ${AIRTABLE_API_KEY}
      baseUrl: ${AIRTABLE_URL}/v0

# Every command runs under `whole_mount.py`, which refuses a walk of a
# whole mount, a `cat` of a whole table, and a `notion` search or query that
# asks for everything, asked before the line runs, to refuse it whole, and
# before each command.
profiles:
  default:
    policy:
      pre_execute:
        - {script: ../../whole_mount.py, runtime: monty}
      pre_command:
        - {script: ../../whole_mount.py, runtime: monty}
