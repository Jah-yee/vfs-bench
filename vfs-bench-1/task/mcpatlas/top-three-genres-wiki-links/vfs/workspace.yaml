mode: EXEC

# The character type upstream's servers run under: started with no locale,
# their Python coerces it to C.UTF-8 (PEP 538) and what they run inherits
# it, so grep, sed and expr match whole characters there as here.
env:
  LC_CTYPE: C.UTF-8

# No Python. None of the fifteen tools Atlas enables runs code on this
# machine, so an interpreter here would be a capability the other arm was
# never given; `e2b-server` runs code in its own remote sandbox, and so does
# its command here.
runtimes:
  - workspace

clis:
  # MongoDB as the MCP arm has it: its own server, on the database this run
  # restores from Atlas's dump, listing only the tools Atlas enables,
  # `mongodb <tool>` for its `mongodb_<tool>`. timeoutMs is that arm's
  # per-call bound, upstream's `toolCallTimeoutMs`.
  mongodb:
    cli: ../../../../cli/mcpatlas/tools.mjs:MONGODB
    config:
      apiBase: ${MONGODB_CLI_URL}
      timeoutMs: 60000

  # The three servers no mount or native CLI can speak for. Each is the server
  # the MCP arm runs, on the same workspace, listing only the tools Atlas
  # enables. timeoutMs is that arm's per-call bound, which is upstream's: its
  # harness gives each tool call `toolCallTimeoutMs`, 60 seconds by default.
  exa:
    cli: ../../../../cli/mcpatlas/tools.mjs:EXA
    config:
      apiBase: ${EXA_CLI_URL}
      timeoutMs: 60000

  e2b-server:
    cli: ../../../../cli/mcpatlas/tools.mjs:E2B
    config:
      apiBase: ${E2B_SERVER_CLI_URL}
      timeoutMs: 60000

  national-parks:
    cli: ../../../../cli/mcpatlas/tools.mjs:NATIONAL_PARKS
    config:
      apiBase: ${NATIONAL_PARKS_CLI_URL}
      timeoutMs: 60000

mounts:
  # A shell without scratch space is not a shell: agents write a heredoc to
  # /tmp and read it back a line later.
  /tmp:
    vfs: ram

  # The database, read-only, as every MongoDB tool Atlas enables here reads.
  /mongodb:
    vfs: mongodb
    mode: READ
    config:
      uri: ${MONGODB_URL}

# Every command runs under `whole_mount.py`, which refuses a walk of a
# whole mount and a `cat` of a whole table, asked before the line runs, to
# refuse it whole, and before each command.
profiles:
  default:
    policy:
      pre_execute:
        - {script: ../../whole_mount.py, runtime: monty}
      pre_command:
        - {script: ../../whole_mount.py, runtime: monty}
