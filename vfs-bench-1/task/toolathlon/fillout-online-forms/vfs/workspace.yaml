mode: EXEC
runtimes:
  - workspace
clis:
  browser:
    cli: ../../../../cli/toolathlon/browser.mjs:BROWSER
    config:
      apiBase: ${BROWSER_URL}
      timeoutMs: 120000
  memory:
    cli: ../../../../cli/toolathlon/travel-video.mjs:MEMORY
    config:
      apiBase: ${MEMORY_CLI_URL}
      timeoutMs: 100000
mounts:
  /tmp:
    vfs: ram
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
