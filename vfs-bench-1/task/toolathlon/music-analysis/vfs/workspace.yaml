mode: EXEC
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace
clis:
  excel:
    cli: ../../../../cli/toolathlon/documents.mjs:EXCEL
    config:
      apiBase: ${EXCEL_CLI_URL}
  google-sheet:
    cli: ../../../../cli/toolathlon/google.mjs:SHEETS
    config:
      apiBase: ${SHEETS_CLI_URL}
  git:
    cli: git
mounts:
  /tmp:
    vfs: ram
  /gd:
    vfs: gdrive
    mode: READ
    config:
      client_id: fake
      client_secret: fake
      refresh_token: gws-integ-token
      api_base: ${GWS_URL}
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
