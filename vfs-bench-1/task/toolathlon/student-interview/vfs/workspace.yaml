mode: EXEC
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
runtimes:
  - workspace
clis:
  emails:
    cli: ../../../../cli/toolathlon/emails.mjs:EMAILS
    config:
      apiBase: ${EMAILS_CLI_URL}
      timeoutMs: 120000
  google-calendar:
    cli: ../../../../cli/toolathlon/google.mjs:CALENDAR
    config:
      apiBase: ${CALENDAR_CLI_URL}
mounts:
  /tmp:
    vfs: ram
  /mail:
    vfs: email
    config:
      imapHost: localhost
      imapPort: 1143
      smtpHost: localhost
      smtpPort: 1587
      username: susan_reyes@mcp.com
      password: Sreyes3208Dq
      useSsl: false
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
