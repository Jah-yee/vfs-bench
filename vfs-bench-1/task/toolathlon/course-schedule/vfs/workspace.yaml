mode: EXEC
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace
clis:
  pdf-tools:
    cli: ../../../../cli/toolathlon/documents.mjs:PDF
    config:
      apiBase: ${PDF_TOOLS_CLI_URL}
  excel:
    cli: ../../../../cli/toolathlon/documents.mjs:EXCEL
    config:
      apiBase: ${EXCEL_CLI_URL}
  memory:
    cli: ../../../../cli/toolathlon/travel-video.mjs:MEMORY
    config:
      apiBase: ${MEMORY_CLI_URL}
      timeoutMs: 100000
  fetch:
    cli: ../../../../cli/toolathlon/research.mjs:WEB
    config:
      apiBase: ${FETCH_CLI_URL}
      timeoutMs: 100000
  web-search:
    cli: ../../../../cli/toolathlon/research.mjs:SEARCH
    config:
      apiBase: ${SEARCH_CLI_URL}
mounts:
  /tmp:
    vfs: ram
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
