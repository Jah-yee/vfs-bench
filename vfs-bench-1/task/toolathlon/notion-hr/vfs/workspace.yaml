mode: EXEC
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
runtimes:
  - workspace
clis:
  notion:
    cli: ../../../../cli/toolathlon/travel-video.mjs:NOTION
    config:
      apiBase: ${NOTION_CLI_URL}
      timeoutMs: 100000
  emails:
    cli: ../../../../cli/toolathlon/emails.mjs:EMAILS
    config:
      apiBase: ${EMAILS_CLI_URL}
      timeoutMs: 120000
  pdf-tools:
    cli: ../../../../cli/toolathlon/documents.mjs:PDF
    config:
      apiBase: ${PDF_TOOLS_CLI_URL}
mounts:
  /tmp:
    vfs: ram
  /notion:
    vfs: notion
    config:
      apiKey: notion-hr
      baseUrl: ${NOTION_URL}/v1
  /mail:
    vfs: email
    config:
      imapHost: localhost
      imapPort: 1143
      smtpHost: localhost
      smtpPort: 1587
      username: jamess@mcp.com
      password: JsteuyatGI4v
      useSsl: false
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
