mode: EXEC

env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8

profiles:
  default:
    cwd: /workspace

runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      # Preload for dynamic imports such as __import__.
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace

clis:
  google-sheet:
    cli: ../../../../cli/toolathlon/google.mjs:SHEETS
    config:
      apiBase: ${SHEETS_CLI_URL}

  git:
    cli: git
mounts:
  /tmp:
    vfs: ram

  /gd:
    vfs: gdrive
    mode: READ
    config:
      client_id: fake
      client_secret: fake
      refresh_token: gws-integ-token
      api_base: ${GWS_URL}

  /work:
    vfs: ram

  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
