mode: EXEC
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
runtimes:
  - workspace
clis:
  notion:
    cli: ../../../../cli/toolathlon/travel-video.mjs:NOTION
    config:
      apiBase: ${NOTION_CLI_URL}
      timeoutMs: 100000
  word:
    cli: ../../../../cli/toolathlon/documents.mjs:WORD
    config:
      apiBase: ${WORD_CLI_URL}
mounts:
  /tmp:
    vfs: ram
  /notion:
    vfs: notion
    config:
      apiKey: notion-personal-website
      baseUrl: ${NOTION_URL}/v1
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
