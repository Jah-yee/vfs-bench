mode: EXEC
runtimes:
  - workspace
clis:
  gh:
    cli: gh
    config:
      token: fake-token
      baseUrl: ${GITHUB_URL}
  memory:
    cli: ../../../../cli/toolathlon/travel-video.mjs:MEMORY
    config:
      apiBase: ${MEMORY_CLI_URL}
      timeoutMs: 100000
mounts:
  /tmp:
    vfs: ram
  /template:
    vfs: github
    config:
      token: fake-token
      owner: academicpages
      repo: academicpages.github.io
      ref: master
      baseUrl: ${GITHUB_URL}
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
