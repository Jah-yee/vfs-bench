mode: EXEC
runtimes:
  - workspace
clis:
  browser:
    cli: ../../../../cli/toolathlon/browser.mjs:BROWSER
    config:
      apiBase: ${BROWSER_URL}
      timeoutMs: 120000
  google-map:
    cli: ../../../../cli/toolathlon/travel-video.mjs:MAPS
    config:
      apiBase: ${MAPS_CLI_URL}
      timeoutMs: 10000
  notion:
    cli: ../../../../cli/toolathlon/travel-video.mjs:NOTION
    config:
      apiBase: ${NOTION_CLI_URL}
      timeoutMs: 100000
  emails:
    cli: ../../../../cli/toolathlon/emails.mjs:EMAILS
    config:
      apiBase: ${EMAILS_CLI_URL}
      timeoutMs: 120000
mounts:
  /tmp:
    vfs: ram
  /notion:
    vfs: notion
    config:
      apiKey: notion-find-job
      baseUrl: ${NOTION_URL}/v1
  /mail:
    vfs: email
    config:
      imapHost: 127.0.0.1
      imapPort: ${BUSINESS_IMAP_PORT}
      smtpHost: 127.0.0.1
      smtpPort: ${BUSINESS_SMTP_PORT}
      username: janet.mendoza@mcp.com
      password: janet1997$71
      useSsl: false
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
