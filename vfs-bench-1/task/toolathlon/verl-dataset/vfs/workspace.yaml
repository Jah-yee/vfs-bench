mode: EXEC
runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace
mounts:
  /tmp:
    vfs: ram
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
clis:
  web-search:
    cli: ../../../../cli/toolathlon/research.mjs:SEARCH
    config:
      apiBase: ${SEARCH_CLI_URL}
  fetch:
    cli: ../../../../cli/toolathlon/research.mjs:WEB
    config:
      apiBase: ${FETCH_CLI_URL}
      timeoutMs: 100000
  huggingface:
    cli: ../../../../cli/toolathlon/hub.mjs:HUB
    config:
      endpoint: http://127.0.0.1:5200/mcp
      token: verl-dataset
  hf:
    cli: hf
    config:
      endpoint: ${HF_ENDPOINT}
      token: verl-dataset
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
