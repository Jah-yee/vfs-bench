mode: EXEC
runtimes:
  - workspace
clis:
  web-search:
    cli: ../../../../cli/toolathlon/research.mjs:SEARCH
    config:
      apiBase: ${SEARCH_CLI_URL}
  browser:
    cli: ../../../../cli/toolathlon/browser.mjs:BROWSER
    config:
      apiBase: ${BROWSER_URL}
      timeoutMs: 120000
  fetch:
    cli: ../../../../cli/toolathlon/research.mjs:WEB
    config:
      apiBase: ${FETCH_CLI_URL}
      timeoutMs: 100000
  notion:
    cli: ../../../../cli/toolathlon/travel-video.mjs:NOTION
    config:
      apiBase: ${NOTION_CLI_URL}
      timeoutMs: 100000
mounts:
  /tmp:
    vfs: ram
  /notion:
    vfs: notion
    config:
      apiKey: notion-movies
      baseUrl: ${NOTION_URL}/v1
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
