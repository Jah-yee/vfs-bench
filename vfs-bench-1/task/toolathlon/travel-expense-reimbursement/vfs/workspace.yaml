mode: EXEC
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace
clis:
  emails:
    cli: ../../../../cli/toolathlon/emails.mjs:EMAILS
    config:
      apiBase: ${EMAILS_CLI_URL}
      timeoutMs: 120000
  snowflake:
    cli: ../../../../cli/toolathlon/travel-video.mjs:SNOWFLAKE
    config:
      apiBase: ${SNOWFLAKE_CLI_URL}
      timeoutMs: 120000
  pdf-tools:
    cli: ../../../../cli/toolathlon/documents.mjs:PDF
    config:
      apiBase: ${PDF_TOOLS_CLI_URL}
mounts:
  /tmp:
    vfs: ram
  /mail:
    vfs: email
    config:
      imapHost: localhost
      imapPort: 1143
      smtpHost: localhost
      smtpPort: 1587
      username: jennifer_peterson22@mcp.com
      password: jennRznBZuZD
      useSsl: false
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
