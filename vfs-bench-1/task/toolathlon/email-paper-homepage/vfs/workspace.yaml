mode: EXEC
runtimes:
  - workspace
clis:
  emails:
    cli: ../../../../cli/toolathlon/emails.mjs:EMAILS
    config:
      apiBase: ${EMAILS_CLI_URL}
      timeoutMs: 120000
  gh:
    cli: gh
    config:
      token: fake-token
      baseUrl: ${GITHUB_URL}
      repo: integ-user/My-Homepage
mounts:
  /tmp:
    vfs: ram
  /mail:
    vfs: email
    config:
      imapHost: localhost
      imapPort: 1143
      smtpHost: localhost
      smtpPort: 1587
      username: timothyb@mcp.com
      password: bennett#t236
      useSsl: false
  /homepage:
    vfs: github
    config:
      token: fake-token
      owner: integ-user
      repo: My-Homepage
      ref: master
      baseUrl: ${GITHUB_URL}
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
