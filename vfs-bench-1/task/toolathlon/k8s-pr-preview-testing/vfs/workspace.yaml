mode: EXEC
runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace
clis:
  browser:
    cli: ../../../../cli/toolathlon/browser.mjs:BROWSER
    config:
      apiBase: ${BROWSER_URL}
      timeoutMs: 120000
  kubectl:
    cli: ../../../../cli/toolathlon/kubectl.mjs:KUBECTL
    config:
      binary: ${KUBECTL}
      native: ${KUBECTL_NATIVE}
      processDir: ${K8S_PROCESS_DIR}
      kubeconfig: ${KUBECONFIG}
      workdir: ${AGENT_WORKSPACE}
mounts:
  /tmp:
    vfs: ram
  /k8s:
    vfs: ../../../../vfs/kubernetes.mjs:KubernetesVFS
    mode: READ
    config:
      kubeconfig: ${KUBECONFIG}
  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8
profiles:
  default:
    cwd: /workspace
