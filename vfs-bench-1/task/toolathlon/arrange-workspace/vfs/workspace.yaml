mode: EXEC

env:
  HOME: /workspace
  LC_CTYPE: C.UTF-8

profiles:
  default:
    cwd: /workspace

runtimes:
  - name: pyodide
    config:
      lockFileUrl: ${TOOLATHLON_PYTHON}/pyodide-lock.json
      packageBaseUrl: ${TOOLATHLON_PYTHON}/
      # Preload for dynamic imports such as __import__.
      packages:
        - openpyxl
        - xlsxwriter
        - pypdf2
        - pymupdf
        - pandas
        - numpy
        - pyarrow
        - pillow
        - lxml
        - python-docx
        - python-pptx
        - pytesseract
        - olefile
  - workspace

clis:
  pdf-tools:
    cli: ../../../../cli/toolathlon/documents.mjs:PDF
    config:
      apiBase: ${PDF_TOOLS_CLI_URL}
  excel:
    cli: ../../../../cli/toolathlon/documents.mjs:EXCEL
    config:
      apiBase: ${EXCEL_CLI_URL}

  git:
    cli: git
mounts:
  /tmp:
    vfs: ram

  /workspace:
    vfs: disk
    config:
      root: ${AGENT_WORKSPACE}
