[settings]
known_first_party = agent
# isort takes the src root's own directory name for a first-party module, so
# a checkout named `toolathlon/` sorts `import toolathlon` (task/toolathlon,
# reached through sys.path) into the first-party group, while CI's
# `vfs-bench/` leaves it in the default group with the other sys.path
# modules. Pin the section CI computes so the hook agrees everywhere.
known_third_party = toolathlon
